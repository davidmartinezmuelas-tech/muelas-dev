<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensaje enviado — Muelas Dev</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111111; --paper: #f7f5f0; --muted: #6b675f; --border: #d0ccc4;
    --accent: #b5402e; --serif: 'Playfair Display', Georgia, serif;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 400;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .card { max-width: 540px; text-align: center; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.25rem; }
  h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 1rem; }
  h1 em { font-style: italic; color: var(--accent); }
  p { font-size: 16px; line-height: 1.7; color: #444; margin-bottom: 0.4rem; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 2rem; }
  a.btn { display: inline-block; background: var(--ink); color: #fff; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; padding: 12px 24px; text-decoration: none; transition: opacity 0.2s; }
  a.btn:hover { opacity: 0.75; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Muelas Dev</div>
    <h1>Mensaje <em>enviado</em>.</h1>
    <p>Gracias por escribir. Te respondo en menos de 24 horas.</p>
    <p class="sub">Message sent — I'll get back to you within 24 hours.</p>
    <a class="btn" href="./index.html">← Volver al inicio</a>
  </div>

</body>
</html>
